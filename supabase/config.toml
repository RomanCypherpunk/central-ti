project_id = "central-ti"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.rate_limit]
email_sent = 10
token_refresh = 60
sign_in_sign_ups = 10
token_verifications = 10

[auth.email]
double_confirm_changes = true
secure_password_change = true
# Cadastro exige confirmar o e-mail com um código de 6 dígitos, igual à
# recuperação de senha: garante que a pessoa tem acesso à caixa que informou.
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 6

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 587
user = "resend"
pass = "env(RESEND_SMTP_PASS)"
admin_email = "helpdeskti@madeirasgasometro.com.br"
sender_name = "TI Gasômetro Madeiras"

[auth.email.template.recovery]
subject = "Recuperação de senha — TI Gasômetro Madeiras"
content_path = "./supabase/templates/recovery.html"

# Sem este template o Supabase manda o padrão dele: em inglês e com link de
# confirmação, em vez do código de 6 dígitos que a tela de cadastro espera.
# O remetente é o mesmo de todos os e-mails de auth ([auth.email.smtp] acima).
[auth.email.template.confirmation]
subject = "Confirme seu e-mail — TI Gasômetro Madeiras"
content_path = "./supabase/templates/confirmacao.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[realtime]
enabled = true

[storage]
enabled = true

[storage.analytics]
enabled = true
max_namespaces = 10

[storage.image_transformation]
enabled = true

[functions.criar-usuario]
verify_jwt = true

[functions.notificar-portal]
verify_jwt = true
