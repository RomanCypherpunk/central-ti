<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base de soluções — Central Única de TI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap">
  <!--A BIBLIOTECA DO SUPABASE COMECA A BAIXAR JUNTO COM O CSS. Sem isto ela
       so era descoberta no fim da cadeia html -> main.js -> sessao.js ->
       supabase-config.js, e a tela esperava essa fila inteira.-->
  <link rel="modulepreload" href="js/vendor/supabase-js.js">
  <link rel="icon" href="assets/img/favicon.ico">
  <!--GERA O PDF DA SOLUCAO, DO LADO DO CLIENTE, SEM SERVIDOR-->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    // Antes da primeira pintura, senao o menu abre e fecha na frente do usuario.
    document.documentElement.dataset.sidebar =
      localStorage.getItem("sidebarColapsada") === "true" ? "colapsada" : "expandida";
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/esqueleto.css">
</head>
<body class="base-pagina" data-carregando data-guarda>
  <nav class="sidebar">
    <div class="sidebar__topo">
      <a class="sidebar__logo-link" href="index.html"><img class="sidebar__logo" src="assets/img/logo-claro.svg" alt="Gasometro"></a>
    </div>

    <div class="sidebar__menu">
      <a class="sidebar__link sidebar__link--ativo" href="index.html">
        <svg class="sidebar__link-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5c0-1.1.9-2 2-2h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H3z"/><path d="M21 5c0-1.1-.9-2-2-2h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h8z"/></svg>
        <span class="sidebar__link-texto">Início</span>
      </a>
      <!--SO A EQUIPE DE TI CADASTRA SOLUCAO — NASCE ESCONDIDO, main.js REVELA-->
      <a class="sidebar__link " href="nova-solucao.html" data-equipe-ti hidden>
        <svg class="sidebar__link-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.8 2.8-2.6-2.6z"/></svg>
        <span class="sidebar__link-texto">Nova Solução</span>
      </a>
    </div>

    <!--RECOLHER: NO RODAPE, MESMO PADRAO DO PAINEL (.painel-nav__colapsar) —
        o padrao a seguir entre as duas telas e o do Painel, nao o antigo
        botao-pilula que ficava ao lado do logo aqui na Base.-->
    <div class="sidebar__espaco" aria-hidden="true"></div>
    <button class="sidebar__colapsar" type="button" id="sidebar-colapsar"
            aria-label="Recolher menu" aria-expanded="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 6l-6 6 6 6"/>
      </svg>
      <span class="sidebar__colapsar-texto">Recolher menu</span>
    </button>
  </nav>
  <header class="header">
    <p class="text-header">Base de soluções - Gasômetro madeiras</p>

    <!--ACOES DA DIREITA: MESMA ESTRUTURA DO .topo DO RESTO DO SITE (index.css),
        so que com o CSS proprio da Base — .topo__acoes daqui pra baixo tem
        estilo local em base.css, nao herda de index.css.
        As classes topo__perfil/usuario/menu e data-nome/data-setor/data-iniciais/
        data-acao="sair" sao as que o main.js procura — nao renomear.-->
    <div class="topo__acoes">

      <div class="topo__perfil">
        <button class="topo__usuario" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="topo__avatar" data-iniciais></span>
          <span class="topo__usuario-texto">
            <span class="topo__usuario-nome" data-nome></span>
            <span class="topo__usuario-setor" data-setor></span>
          </span>
          <svg class="topo__usuario-seta" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="topo__menu">
          <a class="topo__menu-item" href="index.html">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M4 11.5 12 4.5l8 7" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M6 10.5V19h12v-8.5" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Início
          </a>
          <a class="topo__menu-item" href="perfil.html">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <path d="M5 20a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round"/>
            </svg>
            Dados pessoais
          </a>
          <a class="topo__menu-item" href="solicitacoes.html">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <rect x="3.5" y="3.5" width="17" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <path d="M7.5 9h9M7.5 13h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            Minhas solicitações
          </a>

          <!--PORTAL: SO PARA ADMIN. NASCE ESCONDIDO E O main.js MOSTRA-->
          <a class="topo__menu-item" href="portal.html" data-menu-portal hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <path d="M3.5 9h17" stroke="currentColor" stroke-width="1.7"/>
              <path d="M8 13h3.5M8 16h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            Portal de Chamados
          </a>
        </div>
      </div>

      <button class="topo__sair" type="button" data-acao="sair">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M14.5 4.5h3.2a1.8 1.8 0 0 1 1.8 1.8v11.4a1.8 1.8 0 0 1-1.8 1.8h-3.2"
                fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.5 15.5 5 12l4.5-3.5M5 12h9" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Sair</span>
      </button>

    </div>
  </header>
  <main class="conteudo">
    <div class="busca-secao">
      <p class="busca-contagem" id="busca-contagem"></p>

      <div class="busca-linha">
        <div class="busca-barra">
          <svg class="busca-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input class="busca-input" type="text" id="busca-input" placeholder="Busque por erro, código, caminho...">
        </div>

        <div class="visualizacao-grupo">
          <button class="visualizacao-btn visualizacao-btn--ativo" type="button" id="visualizacao-grade" aria-label="Ver em grade">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          </button>
          <button class="visualizacao-btn" type="button" id="visualizacao-lista" aria-label="Ver em lista">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
        </div>
      </div>

      <div class="filtros-barra">
        <select class="filtro-select" id="filtro-tipo">
          <option value="">Tipo</option>
          <option value="erro">Erro</option>
          <option value="script">Script</option>
          <option value="procedimento">Procedimento</option>
        </select>
        <select class="filtro-select" id="filtro-setor">
          <option value="">Setor</option>
        </select>
        <select class="filtro-select" id="filtro-autor">
          <option value="">Autor</option>
        </select>
        <select class="filtro-select" id="filtro-periodo">
          <option value="">Período</option>
          <option value="7">Últimos 7 dias</option>
          <option value="30">Últimos 30 dias</option>
          <option value="90">Últimos 90 dias</option>
        </select>

        <button class="ordenar-btn" type="button" id="ordenar-btn">
          <svg class="ordenar-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4l-3 3M7 4l3 3"/><path d="M17 20V4M17 20l-3-3M17 20l3-3"/></svg>
          <span id="ordenar-texto">Mais recentes</span>
        </button>
      </div>

      <div class="filtros-aplicados" id="filtros-aplicados" hidden>
        <span class="filtros-aplicados__label">Filtros aplicados</span>
        <div class="filtros-aplicados__chips" id="filtros-aplicados-chips"></div>
        <button class="filtros-limpar" type="button" id="filtros-limpar">Limpar tudo</button>
      </div>

      <div class="busca-divisor"></div>

      <p class="solucoes-vazio" id="solucoes-vazio" hidden></p>
      <div class="solucoes-grade" id="solucoes-grade"></div>
    </div>
  </main>

  <!--PAINEL DE DETALHE-->
  <div class="painel-overlay" id="painel-overlay" hidden>
    <aside class="painel" id="painel">
      <div class="painel__topo">
        <div class="painel__topo-selos">
          <span class="tipo-pill" id="painel-tipo"></span>
          <span class="painel__modulo" id="painel-modulo"></span>
        </div>
        <div class="painel__topo-acoes">
          <!--SO A EQUIPE DE TI EDITA/APAGA — NASCE ESCONDIDO, main.js REVELA-->
          <button class="painel__icone-btn" type="button" id="painel-editar" aria-label="Editar" data-equipe-ti hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button class="painel__icone-btn" type="button" id="painel-excluir" aria-label="Excluir" data-equipe-ti hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          </button>
          <button class="painel__icone-btn" type="button" id="painel-expandir" aria-label="Expandir">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
          </button>
          <button class="painel__icone-btn" type="button" id="painel-fechar" aria-label="Fechar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <p class="painel__erro" id="painel-erro"></p>

      <div class="painel__corpo" id="painel-corpo"></div>

      <!--BAIXAR PDF: MONTA O DOCUMENTO NA HORA A PARTIR DO QUE ESTA NA TELA,
          NAO PRECISA DE SERVIDOR. VISIVEL PRA QUEM PODE VER A SOLUCAO —
          nao e acao de edicao, entao nao tem data-equipe-ti.-->
      <div class="painel__rodape">
        <button class="painel__baixar" type="button" id="painel-baixar-pdf">Baixar PDF</button>
      </div>
    </aside>
  </div>

  <!--IMAGEM DO PASSO EM TAMANHO GRANDE-->
  <div class="lightbox" id="lightbox" hidden>
    <img class="lightbox__imagem" id="lightbox-imagem" src="" alt="">
  </div>

  <!--CONFIRMACAO DE EXCLUSAO-->
  <div class="confirmar-overlay" id="confirmar-overlay" hidden>
    <div class="confirmar-modal">
      <h3 class="confirmar-modal__titulo">Excluir solução</h3>
      <p class="confirmar-modal__texto">Essa ação não pode ser desfeita. Tem certeza que deseja excluir esta solução?</p>
      <div class="confirmar-modal__acoes">
        <button class="confirmar-modal__cancelar" type="button" id="confirmar-cancelar">Cancelar</button>
        <button class="confirmar-modal__confirmar" type="button" id="confirmar-excluir" disabled>Aguarde 5s...</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/acesso-guard.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/pages/base.js"></script>
</body>
</html>
