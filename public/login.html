<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Central Única de TI</title>
  <link rel="icon" href="assets/img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login">
  <main class="login__layout">

    <!--35% TELA ESQUERDA-->
    <aside class="login__vitrine">
      <img class="login__logo" src="assets/img/logo-branco.svg" alt="Gasômetro Madeiras">
      <div class="login__chamada">
        <h2 class="login__chamada-titulo">TI Gasômetro Madeiras</h2>
        <p class="login__chamada-texto">
          Acesse a Base de Soluções e o portal de chamados.
        </p>
      </div>
    </aside>

    <!--65% TELA DIREITA-->
    <section class="login__form">
      <form class="login__formulario" novalidate>

        <!--CABECALHO-->
        <h1 class="login__titulo">Entrar</h1>
        <p class="login__subtitulo">
          Use o e-mail corporativo cadastrado.
        </p>

        <!--E-MAIL-->
        <div class="login__campo">
          <label class="login__label" for="email">E-mail corporativo</label>
          <input class="login__input" type="email" id="email" name="email"
                 placeholder="seu.nome@gasometromadeiras.com.br"
                 autocomplete="email" required>
        </div>

        <!--SENHA-->
        <div class="login__campo">
          <label class="login__label" for="senha">Senha</label>
          <div class="login__senha">
            <input class="login__input" type="password" id="senha" name="senha"
                   placeholder="Digite sua senha"
                   autocomplete="current-password" required>
            <button class="login__olho" type="button"
                    data-alvo="senha" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12Z"
                      fill="none" stroke="currentColor" stroke-width="1.7"
                      stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </button>
          </div>
        </div>

        <!--ACOES-->
        <div class="login__acoes">
          <button class="login__botao" type="submit">
            Entrar
            <span aria-hidden="true">→</span>
          </button>
          <p class="login__cadastrar">
            Não tem conta? <a href="cadastro.html">Criar conta</a>
          </p>
        </div>

      </form>
    </section>

  </main>

  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
