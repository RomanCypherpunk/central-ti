<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova solução — Central Única de TI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap">
  <!--A BIBLIOTECA DO SUPABASE COMECA A BAIXAR JUNTO COM O CSS. Sem isto ela
       so era descoberta no fim da cadeia html -> main.js -> sessao.js ->
       supabase-config.js, e a tela esperava essa fila inteira.-->
  <link rel="modulepreload" href="js/vendor/supabase-js.js">
  <link rel="icon" href="assets/img/favicon.ico">
  <script>
    // Antes da primeira pintura, senao o menu abre e fecha na frente do usuario.
    document.documentElement.dataset.sidebar =
      localStorage.getItem("sidebarColapsada") === "true" ? "colapsada" : "expandida";
  </script>
  <link rel="stylesheet" href="css/nova-solucao.css">
  <link rel="stylesheet" href="css/esqueleto.css">
</head>
<body class="solucao-pagina" data-carregando data-guarda>
  <nav class="sidebar">
    <div class="sidebar__topo">
      <a class="sidebar__logo-link" href="index.html"><img class="sidebar__logo" src="assets/img/logo-claro.svg" alt="Gasometro"></a>
    </div>

    <div class="sidebar__menu">
      <a class="sidebar__link" href="base.html">
        <svg class="sidebar__link-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5c0-1.1.9-2 2-2h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H3z"/><path d="M21 5c0-1.1-.9-2-2-2h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h8z"/></svg>
        <span class="sidebar__link-texto">Início</span>
      </a>
      <a class="sidebar__link sidebar__link--ativo" href="nova-solucao.html">
        <svg class="sidebar__link-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.8 2.8-2.6-2.6z"/></svg>
        <span class="sidebar__link-texto">Nova Solução</span>
      </a>
    </div>

    <!--RECOLHER: NO RODAPE, MESMO PADRAO DO PAINEL/BASE (ver base.html).-->
    <div class="sidebar__espaco" aria-hidden="true"></div>
    <button class="sidebar__colapsar" type="button" id="sidebar-colapsar"
            aria-label="Recolher menu" aria-expanded="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 6l-6 6 6 6"/>
      </svg>
      <span class="sidebar__colapsar-texto">Recolher menu</span>
    </button>
  </nav>

  <header class="header">
    <p class="text-header" id="pagina-cabecalho">Nova solução - Gasômetro madeiras</p>

    <!--ACOES DA DIREITA: MESMA ESTRUTURA DO .topo DO RESTO DO SITE — o CSS
        proprio esta em nova-solucao.css, igual base.css.
        As classes topo__perfil/usuario/menu e data-nome/data-setor/data-iniciais/
        data-acao="sair" sao as que o main.js procura — nao renomear.-->
    <div class="topo__acoes">

      <div class="topo__perfil">
        <button class="topo__usuario" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="topo__avatar" data-iniciais></span>
          <span class="topo__usuario-texto">
            <span class="topo__usuario-nome" data-nome></span>
            <span class="topo__usuario-setor" data-setor></span>
          </span>
          <svg class="topo__usuario-seta" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="topo__menu">
          <a class="topo__menu-item" href="index.html">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M4 11.5 12 4.5l8 7" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M6 10.5V19h12v-8.5" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Início
          </a>
          <a class="topo__menu-item" href="perfil.html">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <path d="M5 20a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round"/>
            </svg>
            Dados pessoais
          </a>
          <a class="topo__menu-item" href="solicitacoes.html">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <rect x="3.5" y="3.5" width="17" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <path d="M7.5 9h9M7.5 13h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            Minhas solicitações
          </a>

          <!--PORTAL: SO PARA ADMIN. NASCE ESCONDIDO E O main.js MOSTRA-->
          <a class="topo__menu-item" href="portal.html" data-menu-portal hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <path d="M3.5 9h17" stroke="currentColor" stroke-width="1.7"/>
              <path d="M8 13h3.5M8 16h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            Portal de Chamados
          </a>
        </div>
      </div>

      <button class="topo__sair" type="button" data-acao="sair">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M14.5 4.5h3.2a1.8 1.8 0 0 1 1.8 1.8v11.4a1.8 1.8 0 0 1-1.8 1.8h-3.2"
                fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.5 15.5 5 12l4.5-3.5M5 12h9" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Sair</span>
      </button>

    </div>
  </header>

  <main class="conteudo">
    <div class="registro-layout">
      <div class="registro-esquerda">
        <div class="registro-secao-titulo">
          <span class="registro-secao-titulo__texto">TIPO DE REGISTRO</span>
          <span class="registro-secao-titulo__ajuda">define os campos abaixo</span>
        </div>

        <div class="tipo-cards">
          <button class="tipo-card" type="button" data-tipo="erro">
            <span class="tipo-card__icone tipo-card__icone--erro">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
            </span>
            <span class="tipo-card__titulo">Erro / Correção</span>
            <span class="tipo-card__descricao">Um problema do ERP e como resolver</span>
          </button>

          <button class="tipo-card" type="button" data-tipo="procedimento">
            <span class="tipo-card__icone tipo-card__icone--procedimento">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12l2 2 4-4"/></svg>
            </span>
            <span class="tipo-card__titulo">Procedimento</span>
            <span class="tipo-card__descricao">Passo a passo ou configuração</span>
          </button>
        </div>

        <div class="registro-vazio" id="registro-vazio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
          <span>Escolha um tipo para abrir os campos do registro.</span>
        </div>

        <div class="registro-campos" id="registro-campos" hidden></div>
      </div>

      <aside class="registro-direita">
        <div class="publicacao-cabecalho">
          <span class="publicacao-titulo">PUBLICAÇÃO</span>
        </div>

        <div class="publicacao-divisor"></div>

        <div id="caminho-secao">
          <div class="publicacao-campo">
            <label class="publicacao-label">Nº da página</label>
            <input class="publicacao-input" type="text" id="caminho-pagina-input" placeholder="Ex: 12">
          </div>
          <div class="publicacao-campo">
            <label class="publicacao-label">Caminho</label>
            <input class="publicacao-input" type="text" id="caminho-texto-input" placeholder="Ex: Estoque &gt; Produtos (NL)">
          </div>
        </div>

        <div class="publicacao-campo">
          <label class="publicacao-label" id="setores-label">Setores</label>
          <!--SO QUEM E DOS SETORES MARCADOS VE A SOLUCAO; OPCOES VEM DO SUPABASE-->
          <div class="setores-dropdown" id="setores-dropdown">
            <button class="publicacao-select setores-dropdown__botao" type="button" id="setores-botao" aria-haspopup="true" aria-expanded="false" aria-labelledby="setores-label setores-botao">
              <span class="setores-dropdown__texto" id="setores-texto">Selecione os setores</span>
            </button>
            <div class="setores-dropdown__painel" id="setores-painel" hidden>
              <button class="setores-dropdown__todos" type="button" id="setores-todos">Marcar todos</button>
              <div class="setores-dropdown__lista" id="setores-lista"></div>
            </div>
          </div>
        </div>

        <div class="publicacao-campo">
          <label class="publicacao-label" id="unidades-label">Unidades</label>
          <!--ALCANCE POR UNIDADE, ALEM DO SETOR: a pessoa precisa bater nos
              dois para ver a solucao. Nasce com todas marcadas (o caso
              comum e valer em todo lugar); desmarcar restringe.-->
          <div class="setores-dropdown" id="unidades-dropdown">
            <button class="publicacao-select setores-dropdown__botao" type="button" id="unidades-botao" aria-haspopup="true" aria-expanded="false" aria-labelledby="unidades-label unidades-botao">
              <span class="setores-dropdown__texto" id="unidades-texto">Todas as unidades</span>
            </button>
            <div class="setores-dropdown__painel" id="unidades-painel" hidden>
              <button class="setores-dropdown__todos" type="button" id="unidades-todos">Marcar todos</button>
              <div class="setores-dropdown__lista" id="unidades-lista"></div>
            </div>
          </div>
        </div>

        <!--O AUTOR VEM DA CONTA DE QUEM ESTA CADASTRANDO (autor_id), nao de
            um campo digitado: o nome e a foto saem do perfil e acompanham
            quem edita os proprios dados.-->
        <div class="publicacao-campo">
          <label class="publicacao-label">Autor</label>
          <p class="publicacao-autor" id="autor-nome">—</p>
        </div>

        <div class="publicacao-divisor"></div>

        <p class="publicacao-erro" id="publicacao-erro"></p>

        <button class="publicacao-btn publicacao-btn--principal" type="button" id="salvar-btn">Salvar</button>
      </aside>
    </div>
  </main>

  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/solucao-guard.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/pages/nova-solucao.js"></script>
</body>
</html>
