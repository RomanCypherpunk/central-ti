<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitações - TI</title>
  <link rel="icon" href="assets/img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/solicitacoes.css">
</head>
<body style="visibility: hidden">

  <header class="topo">

    <!--MARCA-->
    <div class="topo__marca">
      <a class="topo__logo-link" href="index.html"><img class="topo__logo" src="assets/img/logo-claro.svg" alt="Gasômetro Madeiras"></a>
      <span class="topo__divisor" aria-hidden="true"></span>
      <span class="topo__produto">Suas solicitações</span>
    </div>

    <!--ACOES DA DIREITA-->
    <div class="topo__acoes">

      <div class="topo__perfil">
        <button class="topo__usuario" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="topo__avatar" data-iniciais></span>
          <span class="topo__usuario-texto">
            <span class="topo__usuario-nome" data-nome></span>
            <span class="topo__usuario-setor" data-setor></span>
          </span>
          <svg class="topo__usuario-seta" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="topo__menu">
          <a class="topo__menu-item" href="index.html">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M4 11.5 12 4.5l8 7" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M6 10.5V19h12v-8.5" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Início
          </a>
          <a class="topo__menu-item" href="perfil.html">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <path d="M5 20a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round"/>
            </svg>
            Dados pessoais
          </a>

          <!--PORTAL: SO PARA ADMIN. NASCE ESCONDIDO E O main.js MOSTRA-->
          <a class="topo__menu-item" href="portal.html" data-menu-portal hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <path d="M3.5 9h17" stroke="currentColor" stroke-width="1.7"/>
              <path d="M8 13h3.5M8 16h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            Portal de Chamados
          </a>

          <a class="topo__menu-item" href="base.html" data-menu-base>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M3.5 5.2A1.7 1.7 0 0 1 5.2 3.5H10a2.5 2.5 0 0 1 2 1v14a2.5 2.5 0 0 0-2-1H5.2a1.7 1.7 0 0 1-1.7-1.7Z"
                    fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M20.5 5.2a1.7 1.7 0 0 0-1.7-1.7H14a2.5 2.5 0 0 0-2 1v14a2.5 2.5 0 0 1 2-1h4.8a1.7 1.7 0 0 0 1.7-1.7Z"
                    fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            </svg>
            Soluções
          </a>
        </div>
      </div>

      <button class="topo__sair" type="button" data-acao="sair">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M14.5 4.5h3.2a1.8 1.8 0 0 1 1.8 1.8v11.4a1.8 1.8 0 0 1-1.8 1.8h-3.2"
                fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.5 15.5 5 12l4.5-3.5M5 12h9" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Sair</span>
      </button>

    </div>
  </header>

  <main class="solicitacoes">
    <div class="solicitacoes__area">

      <header class="solicitacoes__cabecalho">
        <div>
          <h1 class="solicitacoes__titulo">Solicitações</h1>
          <p class="solicitacoes__resumo" data-resumo>Carregando…</p>
        </div>

        <label class="solicitacoes__busca">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="m15.5 15.5 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input type="search" data-busca placeholder="Buscar por número ou assunto"
                 autocomplete="off" aria-label="Buscar nas suas solicitações">
        </label>
      </header>

      <!--FILTRO POR STATUS: a pergunta mais comum e "o que depende de mim?",
          entao "Aguardando você" vem logo depois de "Todas".-->
      <div class="filtros" role="group" aria-label="Filtrar por status">
        <button class="filtro filtro--ativo" type="button" data-filtro="">Todas</button>
        <button class="filtro" type="button" data-filtro="aguardando">Aguardando você</button>
        <button class="filtro" type="button" data-filtro="andamento">Em andamento</button>
        <button class="filtro" type="button" data-filtro="aberto">Abertas</button>
        <button class="filtro" type="button" data-filtro="fechado">Fechadas</button>
      </div>

      <p class="solicitacoes__erro" data-erro role="alert"></p>

      <ul class="chamados" data-lista></ul>

      <p class="chamados__vazio" data-vazio hidden></p>

    </div>
  </main>

  <!--DETALHE: A CONVERSA DO CHAMADO. <dialog> traz fundo esmaecido,
      Esc e foco preso de graça.-->
  <dialog class="detalhe" data-detalhe>
    <article class="detalhe__conteudo">

      <header class="detalhe__topo">
        <div class="detalhe__identificacao">
          <span class="detalhe__numero" data-detalhe-numero></span>
          <h2 class="detalhe__titulo" data-detalhe-titulo></h2>
          <p class="detalhe__meta" data-detalhe-meta></p>
        </div>

        <button class="detalhe__fechar" type="button" data-detalhe-fechar aria-label="Fechar">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </header>

      <div class="conversa" data-conversa></div>

      <!--RESPONDER: o RLS ja permitia o solicitante comentar no proprio
          chamado; faltava a tela. Chamado fechado esconde o campo.-->
      <form class="responder" data-responder>
        <textarea class="responder__campo" data-responder-campo rows="2"
                  placeholder="Escrever para a equipe de TI…"
                  aria-label="Sua resposta"></textarea>
        <div class="responder__acoes">
          <p class="responder__aviso" data-responder-aviso role="status"></p>
          <button class="responder__enviar" type="submit">Enviar</button>
        </div>
      </form>

      <div class="detalhe__fechado" data-detalhe-fechado hidden>
        <p class="detalhe__fechado-texto">
          Este chamado foi finalizado. Se ainda precisar de ajuda com o mesmo
          assunto, reabra em vez de criar um novo.
        </p>
        <button class="detalhe__reabrir" type="button" data-detalhe-reabrir>
          Reabrir chamado
        </button>
        <p class="detalhe__reabrir-aviso" data-detalhe-reabrir-aviso role="status"></p>
      </div>

    </article>
  </dialog>

  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/pages/solicitacoes.js"></script>
</body>
</html>
